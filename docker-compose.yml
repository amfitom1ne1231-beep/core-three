# Боевой запуск CoreThree на одном VPS (BOT.md, фаза 6):
#
#   corethree.ru      → сайт (Next.js)
#   bot.corethree.ru  → сервис бота: webhook Telegram, мини-приложение, API
#
# Caddy сам получает и продлевает сертификаты. Postgres — с томом,
# раз в сутки копия базы ложится в ./backups (хранится две недели).
#
# Секреты на сервере, в git их нет:
#   .env              — POSTGRES_PASSWORD (NEXT_PUBLIC_YM_ID, когда будет счётчик;
#                       BOT_MODE=polling, если нужен опрос вместо webhook)
#   deploy/site.env   — по образцу deploy/site.env.example
#   deploy/bot.env    — по образцу deploy/bot.env.example
#
# Как выкладывать — deploy/README.md.

# Логи контейнеров — не больше 30 МБ на каждый: по умолчанию Docker их
# не ограничивает, а диск на сервере небольшой.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - '80:80'
      - '443:443'
      # 443/udp (HTTP/3) не открыт намеренно — deploy/Caddyfile
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - site
      - bot

  site:
    image: corethree-site:latest
    logging: *logging
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://corethree.ru
        NEXT_PUBLIC_YM_ID: ${NEXT_PUBLIC_YM_ID:-}
    restart: unless-stopped
    env_file: deploy/site.env
    environment:
      # заявка — сервису по внутренней сети, без выхода наружу
      BOT_INTAKE_URL: http://bot:8787/api/intake/lead
      # перед сайтом Caddy: адрес посетителя для лимита заявок — от него
      TRUST_PROXY: '1'

  bot:
    image: corethree-bot:latest
    logging: *logging
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file: deploy/bot.env
    environment:
      # polling — когда входящие от Telegram до сервера не доходят:
      # строка BOT_MODE=polling в .env рядом с этим файлом
      BOT_MODE: ${BOT_MODE:-webhook}
      PUBLIC_URL: https://bot.corethree.ru
      SITE_URL: https://corethree.ru
      DATABASE_URL: postgres://corethree:${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD в .env}@db:5432/corethree
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: corethree
      POSTGRES_DB: corethree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD в .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U corethree -d corethree']
      interval: 5s
      timeout: 3s
      retries: 20

  # Копия базы раз в сутки. Пока копии лежат на том же сервере: облачное
  # хранилище в РФ для них — следующий шаг (HANDOFF.md). Восстановление —
  # deploy/README.md, «Копии базы».
  backup:
    image: postgres:17-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD в .env}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        umask 077
        while true; do
          f=/backups/corethree-$$(date +%F).sql.gz
          if pg_dump -h db -U corethree corethree > /tmp/dump.sql && [ -s /tmp/dump.sql ]; then
            gzip -c /tmp/dump.sql > "$$f.part" && mv "$$f.part" "$$f"
            wait=86400
          else
            echo "копия не снята: pg_dump не отработал — повтор через 10 минут" >&2
            wait=600
          fi
          rm -f /tmp/dump.sql "$$f.part"
          find /backups -name 'corethree-*.sql.gz' -mtime +14 -delete
          sleep $$wait
        done

volumes:
  caddy_data:
  caddy_config:
  db:
